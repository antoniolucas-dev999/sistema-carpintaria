<!DOCTYPE html>

<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title
        th:text="${cliente.id == null}
            ? 'Novo Cliente | Sistema de Carpintaria'
            : 'Editar Cliente | Sistema de Carpintaria'">

        Cliente | Sistema de Carpintaria

    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        rel="stylesheet"
        th:href="@{/css/dashboard.css}">


    <style>

        body {
            background: #f5f4f1;
        }


        .cliente-page {
            padding: 30px;
        }


        /* ==================================================
           VOLTAR
        ================================================== */

        .back-link {
            display: inline-flex;
            align-items: center;

            gap: 7px;

            margin-bottom: 22px;

            color: #777069;

            font-size: 11px;

            font-weight: 600;

            text-decoration: none;

            transition: .2s;
        }


        .back-link:hover {
            color: #9a673f;
        }


        /* ==================================================
           CABEÇALHO
        ================================================== */

        .page-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 24px;
        }


        .page-label {
            color: #a87548;

            font-size: 9px;

            font-weight: 700;

            letter-spacing: 1.5px;
        }


        .page-heading h1 {
            margin: 5px 0;

            color: #29241f;

            font-size: 29px;

            font-weight: 700;

            letter-spacing: -.8px;
        }


        .page-heading p {
            margin: 0;

            color: #8e867e;

            font-size: 12px;
        }


        .heading-icon {
            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #29241f,
                    #171513
                );

            color: #d3a46f;

            font-size: 20px;

            box-shadow:
                0 10px 25px
                rgba(35, 29, 24, .12);
        }


        /* ==================================================
           CARD
        ================================================== */

        .form-card {
            max-width: 1100px;

            overflow: hidden;

            border:
                1px solid
                #e9e5df;

            border-radius: 16px;

            background: #ffffff;

            box-shadow:
                0 8px 30px
                rgba(43, 36, 30, .035);
        }


        .form-card-header {
            display: flex;
            align-items: center;

            gap: 12px;

            padding:
                20px
                23px;

            border-bottom:
                1px solid
                #eeeae5;
        }


        .form-header-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border-radius: 10px;

            background: #f2ece6;

            color: #9a6840;

            font-size: 15px;
        }


        .form-card-header h2 {
            margin: 0;

            color: #302a25;

            font-size: 15px;

            font-weight: 700;
        }


        .form-card-header p {
            margin:
                3px
                0
                0;

            color: #989189;

            font-size: 10px;
        }


        .form-card-body {
            padding: 25px;
        }


        /* ==================================================
           SEÇÕES
        ================================================== */

        .form-section {
            margin-bottom: 30px;
        }


        .form-section:last-of-type {
            margin-bottom: 0;
        }


        .section-title {
            display: flex;
            align-items: center;

            gap: 8px;

            margin-bottom: 17px;

            padding-bottom: 10px;

            border-bottom:
                1px solid
                #f0ece7;

            color: #4a433d;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: .3px;

            text-transform: uppercase;
        }


        .section-title i {
            color: #a87548;

            font-size: 13px;
        }


        /* ==================================================
           CAMPOS
        ================================================== */

        .form-label {
            margin-bottom: 7px;

            color: #554e48;

            font-size: 11px;

            font-weight: 650;
        }


        .required {
            color: #a85f50;
        }


        .form-control {
            min-height: 45px;

            border:
                1px solid
                #ded9d3;

            border-radius: 10px;

            background: #fcfbfa;

            color: #302b26;

            font-size: 12px;

            box-shadow: none;

            transition: .2s;
        }


        .form-control:focus {
            border-color: #a97850;

            background: #ffffff;

            box-shadow:
                0 0 0 3px
                rgba(169, 120, 80, .08);
        }


        .form-control::placeholder {
            color: #aaa39c;
        }


        textarea.form-control {
            min-height: 105px;

            resize: vertical;
        }


        .field-help {
            display: block;

            margin-top: 5px;

            color: #aaa29a;

            font-size: 9px;
        }


        /* ==================================================
           AÇÕES
        ================================================== */

        .form-actions {
            display: flex;

            justify-content: flex-end;

            gap: 9px;

            margin-top: 28px;

            padding-top: 21px;

            border-top:
                1px solid
                #eeeae5;
        }


        .btn-cancel {
            min-height: 44px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            padding:
                0
                17px;

            border:
                1px solid
                #ddd8d2;

            border-radius: 10px;

            background: #ffffff;

            color: #625b55;

            font-size: 11px;

            font-weight: 600;

            text-decoration: none;

            transition: .2s;
        }


        .btn-cancel:hover {
            background: #f7f5f2;

            color: #39332e;
        }


        .btn-save {
            min-height: 44px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            padding:
                0
                19px;

            border: 0;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #29241f,
                    #171513
                );

            color: #ffffff;

            font-size: 11px;

            font-weight: 600;

            box-shadow:
                0 8px 22px
                rgba(35, 29, 24, .13);

            transition: .2s;
        }


        .btn-save:hover {
            transform: translateY(-1px);

            box-shadow:
                0 11px 25px
                rgba(35, 29, 24, .18);
        }


        /* ==================================================
           RESPONSIVIDADE
        ================================================== */

        @media (max-width: 768px) {

            .cliente-page {
                padding: 18px;
            }


            .page-heading {
                align-items: flex-start;
            }


            .page-heading h1 {
                font-size: 24px;
            }


            .heading-icon {
                width: 45px;
                height: 45px;

                font-size: 17px;
            }


            .form-card-body {
                padding: 19px;
            }


            .form-actions {
                flex-direction: column-reverse;
            }


            .btn-cancel,
            .btn-save {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="app-layout">


    <!-- ==================================================
         MENU
    ================================================== -->

    <aside
        th:replace="~{fragments/sidebar :: sidebar('clientes')}">
    </aside>



    <!-- ==================================================
         CONTEÚDO
    ================================================== -->

    <main class="main-content">


        <!-- TOPBAR -->

        <header class="topbar">


            <div class="d-flex align-items-center gap-3">


                <button
                    class="mobile-menu-button"
                    id="mobileMenuButton"
                    type="button">

                    <i class="bi bi-list"></i>

                </button>


                <strong
                    th:text="${cliente.id == null}
                        ? 'Novo Cliente'
                        : 'Editar Cliente'">

                    Cliente

                </strong>

            </div>

        </header>



        <!-- ==================================================
             PÁGINA
        ================================================== -->

        <section class="cliente-page">


            <!-- VOLTAR -->

            <a
                th:href="@{/clientes}"
                class="back-link">

                <i class="bi bi-arrow-left"></i>

                Voltar para clientes

            </a>



            <!-- CABEÇALHO -->

            <div class="page-heading">


                <div>


                    <span class="page-label">
                        CLIENTES
                    </span>


                    <h1
                        th:text="${cliente.id == null}
                            ? 'Novo Cliente'
                            : 'Editar Cliente'">

                        Novo Cliente

                    </h1>


                    <p
                        th:text="${cliente.id == null}
                            ? 'Cadastre as informações do novo cliente.'
                            : 'Atualize as informações do cliente selecionado.'">

                        Preencha os dados do cliente.

                    </p>

                </div>



                <div class="heading-icon">

                    <i
                        th:class="${cliente.id == null}
                            ? 'bi bi-person-plus'
                            : 'bi bi-pencil-square'">
                    </i>

                </div>

            </div>



            <!-- ==================================================
                 FORMULÁRIO
            ================================================== -->

            <div class="form-card">


                <div class="form-card-header">


                    <div class="form-header-icon">

                        <i class="bi bi-person-vcard"></i>

                    </div>


                    <div>

                        <h2>
                            Dados do cliente
                        </h2>

                        <p>
                            Os campos com * são obrigatórios.
                        </p>

                    </div>

                </div>



                <div class="form-card-body">


                    <form
                        th:object="${cliente}"
                        th:action="${cliente.id == null}
                            ? @{/clientes/salvar}
                            : @{/clientes/atualizar/{id}(id=${cliente.id})}"
                        method="post">



                        <!-- ==================================================
                             IDENTIFICAÇÃO
                        ================================================== -->

                        <div class="form-section">


                            <div class="section-title">

                                <i class="bi bi-person"></i>

                                Identificação

                            </div>


                            <div class="row g-3">


                                <!-- NOME -->

                                <div class="col-md-8">


                                    <label
                                        for="nomeRazaoSocial"
                                        class="form-label">

                                        Nome / Razão Social
                                        <span class="required">*</span>

                                    </label>


                                    <input
                                        type="text"
                                        id="nomeRazaoSocial"
                                        th:field="*{nomeRazaoSocial}"
                                        class="form-control"
                                        placeholder="Nome completo ou razão social"
                                        required>

                                </div>



                                <!-- CPF / CNPJ -->

                                <div class="col-md-4">


                                    <label
                                        for="cpfCnpj"
                                        class="form-label">

                                        CPF / CNPJ
                                        <span class="required">*</span>

                                    </label>


                                    <input
                                        type="text"
                                        id="cpfCnpj"
                                        th:field="*{cpfCnpj}"
                                        class="form-control"
                                        placeholder="CPF ou CNPJ"
                                        required>

                                </div>

                            </div>

                        </div>



                        <!-- ==================================================
                             CONTATO
                        ================================================== -->

                        <div class="form-section">


                            <div class="section-title">

                                <i class="bi bi-telephone"></i>

                                Contato

                            </div>


                            <div class="row g-3">


                                <!-- TELEFONE -->

                                <div class="col-md-4">


                                    <label
                                        for="telefone"
                                        class="form-label">

                                        Telefone

                                    </label>


                                    <input
                                        type="text"
                                        id="telefone"
                                        th:field="*{telefone}"
                                        class="form-control"
                                        placeholder="(75) 99999-9999">

                                </div>



                                <!-- EMAIL -->

                                <div class="col-md-8">


                                    <label
                                        for="email"
                                        class="form-label">

                                        E-mail

                                    </label>


                                    <input
                                        type="email"
                                        id="email"
                                        th:field="*{email}"
                                        class="form-control"
                                        placeholder="cliente@email.com">

                                </div>

                            </div>

                        </div>



                        <!-- ==================================================
                             ENDEREÇO
                        ================================================== -->

                        <div class="form-section">


                            <div class="section-title">

                                <i class="bi bi-geo-alt"></i>

                                Endereço

                            </div>


                            <div class="row g-3">


                                <!-- ENDEREÇO -->

                                <div class="col-md-8">


                                    <label
                                        for="endereco"
                                        class="form-label">

                                        Endereço

                                    </label>


                                    <input
                                        type="text"
                                        id="endereco"
                                        th:field="*{endereco}"
                                        class="form-control"
                                        placeholder="Rua, número, bairro">

                                </div>



                                <!-- CIDADE -->

                                <div class="col-md-4">


                                    <label
                                        for="cidade"
                                        class="form-label">

                                        Cidade

                                    </label>


                                    <input
                                        type="text"
                                        id="cidade"
                                        th:field="*{cidade}"
                                        class="form-control"
                                        placeholder="Cidade">

                                </div>



                                <!-- CEP -->

                                <div class="col-md-4">


                                    <label
                                        for="cep"
                                        class="form-label">

                                        CEP

                                    </label>


                                    <input
                                        type="text"
                                        id="cep"
                                        th:field="*{cep}"
                                        class="form-control"
                                        placeholder="00000-000">

                                </div>

                            </div>

                        </div>



                        <!-- ==================================================
                             OBSERVAÇÕES
                        ================================================== -->

                        <div class="form-section">


                            <div class="section-title">

                                <i class="bi bi-chat-left-text"></i>

                                Informações adicionais

                            </div>


                            <div class="row">


                                <div class="col-12">


                                    <label
                                        for="observacoes"
                                        class="form-label">

                                        Observações

                                    </label>


                                    <textarea
                                        id="observacoes"
                                        th:field="*{observacoes}"
                                        class="form-control"
                                        rows="4"
                                        placeholder="Informações adicionais sobre o cliente"></textarea>


                                    <span class="field-help">
                                        Campo opcional.
                                    </span>

                                </div>

                            </div>

                        </div>



                        <!-- ==================================================
                             BOTÕES
                        ================================================== -->

                        <div class="form-actions">


                            <a
                                th:href="@{/clientes}"
                                class="btn-cancel">

                                <i class="bi bi-x-lg"></i>

                                Cancelar

                            </a>



                            <button
                                type="submit"
                                class="btn-save">


                                <i class="bi bi-check-lg"></i>


                                <span
                                    th:text="${cliente.id == null}
                                        ? 'Salvar cliente'
                                        : 'Salvar alterações'">

                                    Salvar cliente

                                </span>

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </section>

    </main>

</div>



<!-- ==================================================
     MENU MOBILE
================================================== -->

<script>

    const button =
        document.getElementById(
            "mobileMenuButton"
        );


    const sidebar =
        document.querySelector(
            ".sidebar"
        );


    if (button && sidebar) {

        button.addEventListener(
            "click",
            function () {

                sidebar.classList.toggle(
                    "sidebar-open"
                );

            }
        );

    }

</script>


</body>

</html>
