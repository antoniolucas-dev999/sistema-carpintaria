<!DOCTYPE html>

<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Acesso negado | Sistema de Carpintaria</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <link
        rel="stylesheet"
        th:href="@{/css/dashboard.css}">


    <style>

        body {
            background: #f5f4f1;
        }


        .denied-page {
            min-height:
                calc(100vh - 70px);

            padding: 30px;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .denied-card {
            width: 100%;
            max-width: 620px;

            padding:
                42px
                36px;

            border:
                1px solid
                #e7e1da;

            border-radius: 18px;

            background: #ffffff;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(44, 37, 31, .07);
        }


        .denied-icon {
            width: 74px;
            height: 74px;

            margin:
                0
                auto
                20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: #f5ece7;

            color: #9c604c;

            font-size: 30px;
        }


        .denied-label {
            display: block;

            margin-bottom: 7px;

            color: #a87548;

            font-size: 9px;
            font-weight: 700;

            letter-spacing: 1.5px;
        }


        .denied-card h1 {
            margin:
                0
                0
                10px;

            color: #2d2824;

            font-size: 28px;
            font-weight: 700;

            letter-spacing: -.6px;
        }


        .denied-description {
            max-width: 460px;

            margin:
                0
                auto
                24px;

            color: #8b837b;

            font-size: 12px;

            line-height: 1.7;
        }


        .user-info-card {
            margin:
                0
                auto
                25px;

            padding:
                14px
                16px;

            display: flex;
            align-items: center;

            gap: 12px;

            max-width: 390px;

            border:
                1px solid
                #ece7e1;

            border-radius: 12px;

            background: #faf9f7;

            text-align: left;
        }


        .user-info-icon {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border-radius: 10px;

            background: #f1ebe5;

            color: #936641;

            font-size: 16px;
        }


        .user-info-card strong {
            display: block;

            color: #403a35;

            font-size: 11px;
        }


        .user-info-card span {
            display: block;

            margin-top: 2px;

            color: #979089;

            font-size: 9px;
        }


        .profile-badge {
            display: inline-flex !important;
            align-items: center;

            margin-top: 5px !important;

            padding:
                4px
                7px;

            border-radius: 20px;

            background: #eee7df;

            color: #7a5a40 !important;

            font-size: 8px !important;
            font-weight: 700;
        }


        .denied-actions {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 9px;
        }


        .dashboard-button {
            min-height: 42px;

            padding:
                0
                17px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            border:
                1px solid
                #29241f;

            border-radius: 10px;

            background: #29241f;

            color: #ffffff;

            font-size: 10px;
            font-weight: 700;

            text-decoration: none;

            transition: .2s;
        }


        .dashboard-button:hover {
            background: #171513;

            color: #ffffff;

            transform: translateY(-1px);
        }


        @media (max-width: 768px) {

            .denied-page {
                padding: 18px;
            }


            .denied-card {
                padding:
                    32px
                    20px;
            }


            .denied-card h1 {
                font-size: 23px;
            }


            .denied-icon {
                width: 64px;
                height: 64px;

                font-size: 25px;
            }


            .dashboard-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<div class="app-layout">


    <!-- ==================================================
         MENU
    ================================================== -->

    <aside
        th:replace="~{fragments/sidebar :: sidebar('')}">

    </aside>


    <!-- ==================================================
         CONTEÚDO
    ================================================== -->

    <main class="main-content">


        <header class="topbar">


            <div class="d-flex align-items-center gap-3">


                <button
                    class="mobile-menu-button"
                    id="mobileMenuButton"
                    type="button">

                    <i class="bi bi-list"></i>

                </button>


                <strong>
                    Acesso negado
                </strong>


            </div>


        </header>


        <section class="denied-page">


            <div class="denied-card">


                <div class="denied-icon">

                    <i class="bi bi-shield-lock"></i>

                </div>


                <span class="denied-label">
                    ACESSO RESTRITO
                </span>


                <h1>
                    Você não possui acesso a esta área
                </h1>


                <p class="denied-description">
                    Seu usuário está autenticado corretamente,
                    porém o seu perfil não possui permissão
                    para acessar esta funcionalidade.
                </p>


                <!-- ==================================================
                     USUÁRIO ATUAL
                ================================================== -->

                <div class="user-info-card">


                    <div class="user-info-icon">

                        <i class="bi bi-person"></i>

                    </div>


                    <div>


                        <strong
                            th:text="${nomeUsuario}">

                            Usuário

                        </strong>


                        <span
                            th:text="'Login: ' + ${loginUsuario}">

                            Login: usuario

                        </span>


                        <span
                            class="profile-badge"
                            th:text="${perfilUsuario != null
                                ? perfilUsuario.descricao
                                : 'Perfil não identificado'}">

                            Vendedor

                        </span>


                    </div>


                </div>


                <!-- ==================================================
                     AÇÃO
                ================================================== -->

                <div class="denied-actions">


                    <a
                        th:href="@{/dashboard}"
                        class="dashboard-button">

                        <i class="bi bi-grid-1x2"></i>

                        Voltar ao Dashboard

                    </a>


                </div>


            </div>


        </section>


    </main>


</div>


<script>

    const button =
        document.getElementById(
            "mobileMenuButton"
        );


    const sidebar =
        document.querySelector(
            ".sidebar"
        );


    if (button && sidebar) {

        button.addEventListener(
            "click",
            function () {

                sidebar.classList.toggle(
                    "sidebar-open"
                );

            }
        );

    }

</script>


</body>

</html>
